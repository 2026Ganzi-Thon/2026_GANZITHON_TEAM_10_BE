plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ganzithon'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Boot 4에서 spring-boot-starter-web 의 새 이름
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
    // 비밀번호 BCrypt 해시용 (Spring Security 전체는 쓰지 않는다)
    implementation 'org.springframework.security:spring-security-crypto'
    // JWT 발급·검증. Boot 4는 Jackson 3을 쓰므로 jjwt의 JSON 처리는 jackson 대신 gson 모듈을 쓴다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
    // Swagger UI (Boot 4.x 는 springdoc 3.x)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2' // 테스트 전용 (MySQL 없이 흐름 검증)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17   // JDK 17 / 21 어느 쪽으로 빌드해도 17 기준으로 컴파일
}

// 배포 스크립트가 버전과 상관없이 같은 이름을 쓰도록 고정
bootJar {
    archiveFileName = 'app.jar'
}

// 실행용 jar 하나만 만들기 (app-plain.jar 생성 안 함)
jar {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
}
