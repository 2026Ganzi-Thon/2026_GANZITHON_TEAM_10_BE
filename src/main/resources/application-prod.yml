# 운영 설정: 값을 직접 적지 않고 전부 환경변수(/etc/hackathon.env)를 참조한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # 배포 파이프라인 구축 기간 한정. 엔티티 동시 수정이 시작되면 validate로 전환

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

moyang:
  upload-dir: ${UPLOAD_DIR}   # 기본값 없음: 재배포 때 그림이 지워지지 않도록 jar 밖 경로를 꼭 지정
