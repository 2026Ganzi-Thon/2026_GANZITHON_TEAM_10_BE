# 공통 설정 (모든 환경)
spring:
  config:
    # 프로젝트 루트의 .env(KEY=VALUE)를 읽는다. 없으면 무시. OS 환경변수가 있으면 그쪽이 우선
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

cors:
  # 로컬 기본값. 운영은 application-prod.yml에서 환경변수로 덮어쓴다.
  allowed-origins: http://localhost:5173,http://localhost:3000

moyang:
  upload-dir: ${UPLOAD_DIR:./uploads}
  upstage:
    api-key: ${UPSTAGE_API_KEY:}   # 키는 환경변수로만 받는다. 여기에 직접 적지 않는다
    base-url: https://api.upstage.ai/v1
    model: solar-pro4
    timeout-seconds: 30
  jwt:
    secret: ${JWT_SECRET:}                 # 토큰 서명 키(32자 이상). 환경변수로만 받는다. 운영은 없으면 기동 실패
  demo:
    password: ${DEMO_PASSWORD:}            # 데모 계정 공통 비밀번호. 환경변수로만 받는다(비면 계정을 만들지 않음)
    count: ${DEMO_ACCOUNT_COUNT:6}         # demo1 ~ demoN
    sheep-balance: ${DEMO_SHEEP_BALANCE:0} # 시연용 양털 목표 잔액(demo1~demoN 지갑을 이 값까지 채움). 0이면 끔. 행사 후 환경변수를 지운다
